<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Space Grotesk';font-weight:500;src:url('../fonts/space-grotesk-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:700;src:url('../fonts/space-grotesk-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'DM Sans';font-weight:400;src:url('../fonts/dm-sans-latin-400-normal.woff2') format('woff2')}
html,body{margin:0;background:#0B0B0B;width:1080px;height:1920px;overflow:hidden}
svg{display:block}
text{font-family:'Space Grotesk';font-weight:700;fill:#F5F5F5}
.m{font-weight:500}
</style></head><body><svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const SCENES = /*SCENES*/;
const W='#F5F5F5', K='#0B0B0B', G='#8A8A8A', CX=480, CY=875;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3), ei=x=>Math.pow(cl(x),3), eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const seg=(t,a,b)=>cl((t-a)/(b-a));
const T=(x,y,s,str,o={})=>`<text x="${x}" y="${y}" font-size="${s}" text-anchor="${o.a||'middle'}" ${o.m?'class="m"':''} fill="${o.f||W}" style="fill:${o.f||W};opacity:${o.op??1}" ${o.ls?`letter-spacing="${o.ls}"`:''}>${str}</text>`;
const R=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.fill||'none'}" stroke="${o.stroke===undefined?W:o.stroke}" stroke-width="${o.sw||2}" ${o.d?`stroke-dasharray="${o.d}"`:''} opacity="${o.op??1}"/>`;
const L=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c||W}" stroke-width="${o.sw||2}" ${o.d?`stroke-dasharray="${o.d}"`:''} opacity="${o.op??1}"/>`;
const GX=135, GY=650, CW=90, GP=30;
function grid(fn){ let s=''; for(let r=0;r<4;r++)for(let c=0;c<6;c++){ s+=fn(r,c,GX+c*(CW+GP),GY+r*(CW+GP),r*6+c);} return s; }
const cross=(x,y,col)=>L(x+22,y+22,x+CW-22,y+CW-22,{c:col,sw:5})+L(x+CW-22,y+22,x+22,y+CW-22,{c:col,sw:5});

const DRAW=[
 // 0 gancho: fuga entre clientes
 (t,d)=>{ let s=T(CX,430,80,'FILTRÓ DATOS',{op:eo(seg(t,0,.5))})+T(CX,525,80,'ENTRE CLIENTES',{op:eo(seg(t,.2,.7))});
  s+=R(110,760,260,200,{})+T(240,872,36,'CLIENTE A');
  s+=R(590,760,260,200,{})+T(720,872,36,'CLIENTE B');
  const p=eo(seg(t,.9,2.0));
  s+=L(370,860,370+220*p,860,{sw:5,d:'12 8'});
  if(t>2.0) s+=R(590,760,260,200,{fill:W})+T(720,872,36,'CLIENTE B',{f:K});
  s+=T(CX,1140,34,'un modelo de IA en Workers AI',{m:1,f:G,op:eo(seg(t,2.1,2.6))});
  return s;},
 // 1 configuración que no cuadra
 (t,d)=>{ let s=T(CX,430,84,'UNA CONFIGURACIÓN',{op:eo(seg(t,0,.5))})+T(CX,525,84,'QUE NO CUADRABA',{op:eo(seg(t,.2,.7))});
  const a=eo(seg(t,.7,1.5)), b=eo(seg(t,1.4,2.0));
  s+=T(130,800,30,'ventana de contexto',{a:'start',m:1,f:G})+R(130,820,700*a,60,{fill:W});
  s+=T(130,960,30,'espacio real en caché',{a:'start',m:1,f:G})+R(130,980,455*b,60,{fill:W});
  s+=L(130,1080,830,1080,{c:G,sw:1,op:b});
  s+=T(CX,1150,38,'no coinciden',{op:eo(seg(t,2.1,2.6))});
  return s;},
 // 2 el prompt desborda
 (t,d)=>{ let s=T(CX,430,76,'ACEPTABA PROMPTS',{op:eo(seg(t,0,.5))})+T(CX,520,62,'MÁS LARGOS QUE SU CACHÉ',{op:eo(seg(t,.2,.7))});
  s+=R(130,820,560,100,{});s+=T(130,800,28,'caché',{a:'start',m:1,f:G});
  const w=700*eo(seg(t,.8,2.0));
  s+=R(130,960,w,100,{fill:W});s+=T(130,1100,28,'prompt',{a:'start',m:1,f:G});
  if(t>1.8) s+=L(690,790,690,1080,{c:W,sw:3,d:'8 6'})+T(700,1150,30,'desborda',{a:'start',m:1,op:eo(seg(t,1.8,2.3))});
  return s;},
 // 3 placeholder de 1 token
 (t,d)=>{ let s=T(CX,430,76,'EL BUG LO CAMBIABA',{op:eo(seg(t,0,.5))})+T(CX,520,76,'POR UN SOLO TOKEN',{op:eo(seg(t,.2,.7))});
  const a=eo(seg(t,.6,1.2));
  s+=R(130,800,700,120,{op:1-.7*eo(seg(t,1.2,1.8)),d:t>1.2?'8 6':undefined})+T(CX,878,40,'prompt largo',{m:1,op:1-eo(seg(t,1.2,1.8))});
  const b=eo(seg(t,1.5,2.1)); s+=R(CX-80,1010,160,120,{fill:W,op:b})+T(CX,1090,52,'1',{f:K,op:b});
  s+=L(CX,930,CX,1000,{op:b});
  s+=T(CX,1220,32,'el rechazo no abortó la solicitud',{m:1,f:G,op:eo(seg(t,2.2,2.7))});
  return s;},
 // 4 caché sirve datos de otra sesión
 (t,d)=>{ let s=T(CX,430,76,'Y LA CACHÉ SERVÍA',{op:eo(seg(t,0,.5))})+T(CX,520,76,'DATOS DE OTRA SESIÓN',{op:eo(seg(t,.2,.7))});
  const n=eo(seg(t,.6,1.2));
  for(let r=0;r<3;r++)for(let c=0;c<6;c++){ const x=135+c*120,y=720+r*120,i=r*6+c; const hot=(i===8||i===9)&&t>1.4;
   s+=R(x,y,90,90,{fill:hot?W:'none',op:n,d:hot?undefined:'6 5'}); }
  const q=eo(seg(t,1.8,2.5));
  s+=L(CX,1090,CX,1200,{op:q,sw:3})+R(CX-170,1200,340,90,{op:q})+T(CX,1260,34,'tu respuesta',{op:q});
  return s;},
 // 5 HTTP 200
 (t,d)=>{ let s=T(CX,430,76,'Y EL CLIENTE',{op:eo(seg(t,0,.4))})+T(CX,520,76,'RECIBÍA UN 200',{op:eo(seg(t,.2,.6))});
  const a=eo(seg(t,.6,1.2));
  s+=R(130,760,700,260,{fill:W,op:a})+T(CX,935,170,'200 OK',{f:K,op:a});
  const b=eo(seg(t,1.6,2.2));
  s+=T(CX,1140,38,'no un error',{m:1,f:G,op:b});
  if(t>1.8) s+=L(300,1115,660,1115,{c:G,sw:2});
  return s;},
 // 6 las pruebas
 (t,d)=>{ let s=T(CX,430,76,'LAS PRUEBAS',{op:eo(seg(t,0,.4))})+T(CX,520,76,'NO MIRABAN LA SALIDA',{op:eo(seg(t,.2,.6))});
  const rows=[['códigos HTTP',true,.7],['rendimiento',true,1.3],['la salida',false,1.9]];
  rows.forEach((r,i)=>{ const y=740+i*130, a=eo(seg(t,r[2],r[2]+.4));
   s+=R(130,y,700,100,{op:a,fill:r[1]?'none':W})+T(170,y+66,40,r[0],{a:'start',f:r[1]?W:K,op:a})+T(790,y+68,48,r[1]?'✓':'✗',{a:'end',f:r[1]?W:K,op:a}); });
  return s;},
 // 7 cierre: lección
 (t,d)=>{ let s=T(CX,430,100,'VALIDA',{op:eo(seg(t,0,.4))})+T(CX,550,100,'LA SALIDA',{op:eo(seg(t,.2,.6))});
  const a=eo(seg(t,.9,1.6));
  s+=R(130,800,700,120,{op:a})+T(CX,880,40,'que responda no es que responda bien',{m:1,op:a});
  s+=L(130,990,130+700*eo(seg(t,1.4,2.2)),990,{sw:2});
  s+=T(CX,1070,34,'prueba el contenido, no solo el código',{m:1,f:G,op:eo(seg(t,2,2.6))});
  return s;},
 // 8 cierre: CTA
 (t,d)=>{ let s=T(CX,640,84,'COMENTA',{op:eo(seg(t,0,.4))});
  const a=eo(seg(t,.3,.8)); s+=R(120,720,720,190,{fill:W,op:a})+T(CX,855,118,'SISTEMA',{f:K,op:a});
  s+=T(CX,1010,40,'y te envío mi guía',{m:1,op:eo(seg(t,.9,1.3))});
  s+=T(CX,1100,34,'sígueme y comparte con tu equipo',{m:1,f:G,op:eo(seg(t,1.4,1.9))});
  return s;}
];
const STAR='<path d="M12 1 L14.6 9.4 L23 12 L14.6 14.6 L12 23 L9.4 14.6 L1 12 L9.4 9.4 Z" fill="#F5F5F5"/>';
function render(tg){
  let acc=0, i=0; for(;i<SCENES.length;i++){ if(tg<acc+SCENES[i].dur) break; acc+=SCENES[i].dur; }
  if(i>=SCENES.length){ i=SCENES.length-1; acc-=SCENES[i].dur; }
  const tl=tg-acc, d=SCENES[i].dur, kk=(SCENES[i].base||d)/d, t=tl*kk;
  const sc=Math.min(eo(seg(tl,0,.28)), 1-ei(seg(tl,d-.22,d)));
  let body=DRAW[i](t,d);
  let s=`<rect width="1080" height="1920" fill="${K}"/>`;
  s+=`<g transform="translate(${CX} ${CY}) scale(${Math.max(sc,0.0001)}) translate(${-CX} ${-CY})">${body}</g>`;
  if(sc<.2) s+=`<circle cx="${CX}" cy="${CY}" r="${10*(1-sc/.2)+2}" fill="${W}"/>`;
  // marco fijo, etiqueta y marca de agua (zonas seguras)
  s+=T(70,310,26,'[POST-MORTEM]  CLOUDFLARE · IA',{a:'start',m:1,f:G,ls:2});
  s+=T(890,310,26,String(i+1).padStart(2,'0')+' / '+String(SCENES.length).padStart(2,'0'),{a:'end',m:1,f:G});
  s+=L(70,330,890,330,{c:G,sw:1});
  s+=`<g transform="translate(70 1425)"><g transform="scale(1.1)">${STAR}</g></g>`+T(112,1448,26,'JSRamirez · @jsramirezdev',{a:'start',m:1});
  document.getElementById('s').innerHTML=s;
}
</script></body></html>
