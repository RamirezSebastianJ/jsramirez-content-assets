<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Space Grotesk';font-weight:500;src:url('../fonts/space-grotesk-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:700;src:url('../fonts/space-grotesk-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'DM Sans';font-weight:400;src:url('../fonts/dm-sans-latin-400-normal.woff2') format('woff2')}
html,body{margin:0;background:#0B0B0B;width:1080px;height:1920px;overflow:hidden}
svg{display:block}
text{font-family:'Space Grotesk';font-weight:700;fill:#F5F5F5}
.m{font-weight:500}
</style></head><body><svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const SCENES = /*SCENES*/;
const W='#F5F5F5', K='#0B0B0B', G='#8A8A8A', CX=480, CY=875;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3), ei=x=>Math.pow(cl(x),3), eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const seg=(t,a,b)=>cl((t-a)/(b-a));
const T=(x,y,s,str,o={})=>`<text x="${x}" y="${y}" font-size="${s}" text-anchor="${o.a||'middle'}" ${o.m?'class="m"':''} fill="${o.f||W}" style="fill:${o.f||W};opacity:${o.op??1}" ${o.ls?`letter-spacing="${o.ls}"`:''}>${str}</text>`;
const R=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.fill||'none'}" stroke="${o.stroke===undefined?W:o.stroke}" stroke-width="${o.sw||2}" ${o.d?`stroke-dasharray="${o.d}"`:''} opacity="${o.op??1}"/>`;
const L=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c||W}" stroke-width="${o.sw||2}" ${o.d?`stroke-dasharray="${o.d}"`:''} opacity="${o.op??1}"/>`;
const GX=135, GY=650, CW=90, GP=30;
function grid(fn){ let s=''; for(let r=0;r<4;r++)for(let c=0;c<6;c++){ s+=fn(r,c,GX+c*(CW+GP),GY+r*(CW+GP),r*6+c);} return s; }
const cross=(x,y,col)=>L(x+22,y+22,x+CW-22,y+CW-22,{c:col,sw:5})+L(x+CW-22,y+22,x+22,y+CW-22,{c:col,sw:5});

const DRAW=[
 // 0 gancho: la cache expira y llegan todos
 (t,d)=>{ let s=T(CX,430,76,'LA CACHÉ EXPIRÓ',{op:eo(seg(t,0,.5))})+T(CX,520,76,'Y LLEGARON TODOS',{op:eo(seg(t,.2,.7))});
  s+=R(330,640,220,110,{op:eo(seg(t,.5,.9))})+T(440,708,30,'CACHÉ',{op:eo(seg(t,.5,.9))});
  s+=L(330,640,550,750,{c:G,sw:3,op:eo(seg(t,1.0,1.4))});
  for(let i=0;i<8;i++){ const p=eo(seg(t,1.2+i*.15,1.7+i*.15)); s+=L(130+i*100,980-120*p,130+i*100,980,{sw:4,op:p}); }
  return s;},
 // 1 todos encuentran dato vencido
 (t,d)=>{ let s=T(CX,430,70,'TODOS ENCUENTRAN',{op:eo(seg(t,0,.5))})+T(CX,520,70,'EL DATO VENCIDO',{op:eo(seg(t,.2,.7))});
  s+=R(330,700,220,110,{stroke:G,d:'8 6',op:eo(seg(t,.5,.9))})+T(440,768,28,'VENCIDO',{f:G,op:eo(seg(t,.5,.9))});
  for(let i=0;i<5;i++){ const p=eo(seg(t,.9+i*.2,1.3+i*.2)); s+=L(150+i*165,980,150+i*165+(440-(150+i*165))*p*.9,980-(980-810)*p,{sw:3,op:p}); }
  s+=T(CX,1060,32,'«no está, voy a la base»',{m:1,f:G,op:eo(seg(t,2.2,2.8))});
  return s;},
 // 2 todos van a la base de datos
 (t,d)=>{ let s=T(CX,430,66,'Y TODOS VAN A LA BASE',{op:eo(seg(t,0,.5))})+T(CX,520,66,'DE DATOS A LA VEZ',{op:eo(seg(t,.2,.7))});
  s+=R(330,860,220,150,{op:eo(seg(t,.5,.9))})+T(440,945,28,'BASE DE DATOS',{op:eo(seg(t,.5,.9))});
  for(let i=0;i<9;i++){ const p=eo(seg(t,.9+i*.1,1.5+i*.1)); s+=L(120+i*90,640+40*(i%3),440,860,{sw:3,op:p*.9}); }
  return s;},
 // 3 la base no aguanta
 (t,d)=>{ let s=T(CX,430,76,'LA BASE NO AGUANTA',{op:eo(seg(t,0,.5))});
  const p=eo(seg(t,.5,2.0));
  s+=R(130,700,700,110,{})+R(130,700,700*p,110,{fill:W});
  s+=T(CX,880,32,'carga de la base',{m:1,f:G,op:eo(seg(t,.5,.9))});
  const x=eo(seg(t,2.1,2.5));
  s+=L(430,960,430+100*x,1060,{sw:8})+L(530,960,530-100*x,1060,{sw:8});
  return s;},
 // 4 nombre
 (t,d)=>{ let s=T(CX,500,64,'A ESTO SE LE LLAMA',{op:eo(seg(t,0,.5))});
  const a=eo(seg(t,.5,1.2)); s+=R(70,600,820,160,{fill:W,op:a})+T(CX,712,76,'CACHE STAMPEDE',{f:K,op:a});
  s+=T(CX,860,34,'estampida de caché',{m:1,f:G,op:eo(seg(t,1.5,2.1))});
  return s;},
 // 5 defensa 1: solo uno recalcula
 (t,d)=>{ let s=T(CX,430,66,'DEFENSA 1: SOLO UNO',{op:eo(seg(t,0,.5))})+T(CX,520,66,'RECALCULA',{op:eo(seg(t,.2,.7))});
  s+=R(130,700,200,100,{fill:W,op:eo(seg(t,.5,.9))})+T(230,764,28,'UNO',{f:K,op:eo(seg(t,.5,.9))});
  s+=L(330,750,500*eo(seg(t,.9,1.5))+330*(1-eo(seg(t,.9,1.5))),750,{sw:6});
  s+=R(560,700,270,100,{op:eo(seg(t,.9,1.3))})+T(695,764,28,'BASE',{op:eo(seg(t,.9,1.3))});
  for(let i=0;i<3;i++){ s+=R(130+i*240,900,200,90,{stroke:G,d:'8 6',op:eo(seg(t,1.5+i*.15,1.9+i*.15))})+T(230+i*240,955,26,'espera',{m:1,f:G,op:eo(seg(t,1.5+i*.15,1.9+i*.15))}); }
  return s;},
 // 6 defensa 2: expiracion con azar
 (t,d)=>{ let s=T(CX,430,66,'DEFENSA 2: EXPIRACIÓN',{op:eo(seg(t,0,.5))})+T(CX,520,66,'CON UN POCO DE AZAR',{op:eo(seg(t,.2,.7))});
  s+=L(130,1000,830,1000,{c:G,sw:2,op:eo(seg(t,.4,.8))});
  [200,330,420,560,690].forEach((x,i)=>{ const p=eo(seg(t,.8+i*.25,1.2+i*.25)); s+=L(x,1000,x,1000-170*p,{sw:6,op:p}); });
  s+=T(CX,1090,30,'cada clave vence a una hora distinta',{m:1,f:G,op:eo(seg(t,2.3,2.9))});
  return s;},
 // 7 defensa 3: refrescar antes
 (t,d)=>{ let s=T(CX,430,66,'DEFENSA 3: REFRESCAR',{op:eo(seg(t,0,.5))})+T(CX,520,66,'ANTES DE QUE VENZA',{op:eo(seg(t,.2,.7))});
  s+=L(130,900,830,900,{c:G,sw:2,op:eo(seg(t,.4,.8))});
  s+=L(130,900,130+520*eo(seg(t,.8,2.0)),900,{sw:8});
  s+=L(650,860,650,940,{c:G,sw:3,d:'6 5',op:eo(seg(t,.8,1.2))})+T(650,990,26,'vence',{m:1,f:G,op:eo(seg(t,.8,1.2))});
  const a=eo(seg(t,2.0,2.5)); s+=R(420,780,170,60,{fill:W,op:a})+T(505,823,28,'refresca',{f:K,op:a});
  return s;},
 // 8 cierre: leccion
 (t,d)=>{ let s=T(CX,430,76,'QUE NO VENZAN',{op:eo(seg(t,0,.4))})+T(CX,540,76,'A LA MISMA HORA',{op:eo(seg(t,.2,.6))});
  const a=eo(seg(t,.9,1.6));
  s+=R(130,800,700,120,{op:a})+T(CX,880,40,'reparte los vencimientos',{m:1,op:a});
  s+=L(130,990,130+700*eo(seg(t,1.4,2.2)),990,{sw:2});
  s+=T(CX,1070,34,'y protege tu base de datos',{m:1,f:G,op:eo(seg(t,2,2.6))});
  return s;},
 // 9 cierre: CTA
 (t,d)=>{ let s=T(CX,640,84,'COMENTA',{op:eo(seg(t,0,.4))});
  const a=eo(seg(t,.3,.8)); s+=R(120,720,720,190,{fill:W,op:a})+T(CX,855,118,'SISTEMA',{f:K,op:a});
  s+=T(CX,1010,40,'y te envío mi guía',{m:1,op:eo(seg(t,.9,1.3))});
  s+=T(CX,1100,34,'sígueme y comparte con tu equipo',{m:1,f:G,op:eo(seg(t,1.4,1.9))});
  return s;}
];

const STAR='<path d="M12 1 L14.6 9.4 L23 12 L14.6 14.6 L12 23 L9.4 14.6 L1 12 L9.4 9.4 Z" fill="#F5F5F5"/>';
function render(tg){
  let acc=0, i=0; for(;i<SCENES.length;i++){ if(tg<acc+SCENES[i].dur) break; acc+=SCENES[i].dur; }
  if(i>=SCENES.length){ i=SCENES.length-1; acc-=SCENES[i].dur; }
  const tl=tg-acc, d=SCENES[i].dur, kk=(SCENES[i].base||d)/d, t=tl*kk;
  const sc=Math.min(eo(seg(tl,0,.28)), 1-ei(seg(tl,d-.22,d)));
  let body=DRAW[i](t,d);
  let s=`<rect width="1080" height="1920" fill="${K}"/>`;
  s+=`<g transform="translate(${CX} ${CY}) scale(${Math.max(sc,0.0001)}) translate(${-CX} ${-CY})">${body}</g>`;
  if(sc<.2) s+=`<circle cx="${CX}" cy="${CY}" r="${10*(1-sc/.2)+2}" fill="${W}"/>`;
  // marco fijo, etiqueta y marca de agua (zonas seguras)
  s+=T(70,310,26,'[ARCHITECTURE]  CACHE',{a:'start',m:1,f:G,ls:2});
  s+=T(890,310,26,String(i+1).padStart(2,'0')+' / '+String(SCENES.length).padStart(2,'0'),{a:'end',m:1,f:G});
  s+=L(70,330,890,330,{c:G,sw:1});
  s+=`<g transform="translate(70 1425)"><g transform="scale(1.1)">${STAR}</g></g>`+T(112,1448,26,'JSRamirez · @jsramirezdev',{a:'start',m:1});
  document.getElementById('s').innerHTML=s;
}
</script></body></html>
