<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Space Grotesk';font-weight:500;src:url('../fonts/space-grotesk-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:700;src:url('../fonts/space-grotesk-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'DM Sans';font-weight:400;src:url('../fonts/dm-sans-latin-400-normal.woff2') format('woff2')}
html,body{margin:0;background:#0B0B0B;width:1080px;height:1920px;overflow:hidden}
svg{display:block}
text{font-family:'Space Grotesk';font-weight:700;fill:#F5F5F5}
.m{font-weight:500}
</style></head><body><svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const SCENES = /*SCENES*/;
const W='#F5F5F5', K='#0B0B0B', G='#8A8A8A', CX=480, CY=875;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3), ei=x=>Math.pow(cl(x),3), eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const seg=(t,a,b)=>cl((t-a)/(b-a));
const T=(x,y,s,str,o={})=>`<text x="${x}" y="${y}" font-size="${s}" text-anchor="${o.a||'middle'}" ${o.m?'class="m"':''} fill="${o.f||W}" style="fill:${o.f||W};opacity:${o.op??1}" ${o.ls?`letter-spacing="${o.ls}"`:''}>${str}</text>`;
const R=(x,y,w,h,o={})=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.fill||'none'}" stroke="${o.stroke===undefined?W:o.stroke}" stroke-width="${o.sw||2}" ${o.d?`stroke-dasharray="${o.d}"`:''} opacity="${o.op??1}"/>`;
const L=(x1,y1,x2,y2,o={})=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c||W}" stroke-width="${o.sw||2}" ${o.d?`stroke-dasharray="${o.d}"`:''} opacity="${o.op??1}"/>`;
const title=(a,b,t,sz=58)=>T(CX,430,sz,a,{op:eo(seg(t,0,.5))})+(b?T(CX,520,sz,b,{op:eo(seg(t,.2,.7))}):'');
const XX=(x,y,a,s=26)=>L(x-s,y-s,x+s,y+s,{sw:6,op:a})+L(x+s,y-s,x-s,y+s,{sw:6,op:a});
const NX=i=>140+i*150, NW=100, NY=760;
const nodes=(o={})=>{ let s=''; for(let i=0;i<5;i++){ const st=(o.st&&o.st[i])||0; // 0 normal,1 lleno,2 discontinuo,3 tachado
  const a=(o.a??1); s+=R(NX(i),NY,NW,NW,{fill:st==1?W:'none',stroke:st==2?G:W,d:st==2?'7 6':undefined,op:a,sw:2})+T(NX(i)+NW/2,NY+NW/2+9,26,'R'+(i+1),{f:st==1?K:(st==2?G:W),op:a,m:1}); if(st==3){ s+=XX(NX(i)+NW/2,NY+NW/2,a,30);} } return s; };
const lab=(x,y,str,o={})=>T(x,y,28,str,{m:1,f:o.f||G,op:o.op??1});
const sub=(s,t,a,b)=>T(480,1110,32,s,{m:1,f:G,op:eo(seg(t,a,b))});
const DRAW=[
 (t,d)=>{ let s=title('UNA ALERTA','LLEGA TARDE',t,60); s+=R(140,760,700,44,{op:eo(seg(t,.2,.6))}); const w=760*eo(seg(t,.5,2.4)); s+=R(140,760,Math.min(w,700),44,{fill:W,stroke:W}); if(w>700) s+=R(840,760,w-700,44,{fill:G,stroke:G}); s+=L(560,720,560,845,{sw:3,d:'8 6',op:eo(seg(t,.4,.8))})+lab(560,700,'LÍMITE',{f:W,op:eo(seg(t,.4,.8))}); s+=lab(560,890,'ALERTA',{f:W,op:eo(seg(t,1.6,2.0))}); return s+sub('ya pasaste el límite',t,2.6,3.2); },
 (t,d)=>{ let s=title('INFORMAR','NO ES CONTROLAR',t,60); s+=R(130,720,300,200,{op:eo(seg(t,.4,.9))})+T(280,800,34,'ALERTA',{op:eo(seg(t,.4,.9))})+lab(280,860,'avisa',{op:eo(seg(t,.8,1.3))}); const a=eo(seg(t,1.4,1.9)); s+=R(530,720,300,200,{fill:W,op:a})+T(680,800,34,'TOPE',{f:K,op:a})+T(680,860,28,'frena',{f:K,m:1,op:a}); return s; },
 (t,d)=>{ let s=title('CLOUDFLARE','TOPES DE GASTO',t,60); [['WORKERS',130],['DURABLE OBJECTS',500]].forEach(([n,x],i)=>{ const a=eo(seg(t,.4+i*.5,.9+i*.5)); s+=R(x,720,i?340:300,220,{op:a})+T(x+(i?170:150),800,i?26:30,n,{op:a})+L(x+20,880,x+(i?320:280),880,{sw:3,d:'8 6',op:a})+lab(x+(i?170:150),920,'tope',{f:W,op:a}); }); return s+sub('por producto',t,2.6,3.2); },
 (t,d)=>{ let s=title('CONTAR EL USO','SIN FRENAR NADA',t,56); s+=R(130,720,60,60,{})+R(750,720,60,60,{}); for(let k=0;k<4;k++){ const p=((t*0.55)+k*.25)%1; s+=R(190+p*520,740,24,24,{fill:W,op:eo(seg(t,.3,.8))}); } s+=L(190,750,750,750,{c:G,sw:1}); s+=R(340,880,260,90,{d:'7 6',op:eo(seg(t,1,1.5))})+T(470,937,28,'CONTADOR',{op:eo(seg(t,1,1.5))}); s+=L(470,780,470,880,{c:G,sw:2,d:'6 6',op:eo(seg(t,1.3,1.8))}); return s+sub('las peticiones siguen de largo',t,2.4,3.0); },
 (t,d)=>{ let s=title('AGREGAR CERCA','DE DONDE SE GENERA',t,56); for(let i=0;i<5;i++){ const a=eo(seg(t,.3+i*.12,.8+i*.12)); s+=R(NX(i),700,NW,70,{op:a})+T(NX(i)+NW/2,745,24,'BORDE',{m:1,f:G,op:a}); s+=R(NX(i)+20,790,NW-40,26,{fill:W,op:eo(seg(t,1+i*.1,1.5+i*.1))}); s+=L(NX(i)+NW/2,816,480,960,{c:G,sw:1,op:eo(seg(t,1.5,2.1))}); } s+=R(330,960,300,80,{fill:W,op:eo(seg(t,1.8,2.3))})+T(480,1012,30,'AGREGADO',{f:K,op:eo(seg(t,1.8,2.3))}); return s+sub('en ventanas de tiempo',t,2.6,3.2); },
 (t,d)=>{ let s=title('EL MOTOR DE COBRO','VE UN TOTAL',t,56); s+=R(330,700,300,90,{fill:W,op:eo(seg(t,.3,.8))})+T(480,757,30,'AGREGADO',{f:K,op:eo(seg(t,.3,.8))}); s+=L(480,790,480,900,{sw:3,op:eo(seg(t,.9,1.4))}); s+=R(300,900,360,130,{op:eo(seg(t,1.2,1.7))})+T(480,975,32,'MOTOR DE COBRO',{op:eo(seg(t,1.2,1.7))}); return s+sub('uso acumulado, no cada evento',t,2.2,2.8); },
 (t,d)=>{ let s=title('EL TOPE VIAJA','A LOS SERVIDORES DE BORDE',t,48); s+=R(300,640,360,90,{op:eo(seg(t,.3,.8))})+T(480,697,30,'MOTOR',{op:eo(seg(t,.3,.8))}); for(let i=0;i<5;i++){ const a=eo(seg(t,.9+i*.2,1.5+i*.2)); s+=L(480,730,NX(i)+NW/2,860,{c:G,sw:2,d:'6 6',op:a}); s+=R(NX(i),860,NW,80,{op:a})+T(NX(i)+NW/2,908,24,'TOPE',{m:1,op:a}); } return s+sub('se envía por separado',t,2.6,3.2); },
 (t,d)=>{ let s=title('NINGUNA PETICIÓN','ESPERA AL MOTOR',t,54); s+=R(300,640,360,90,{stroke:G,d:'7 6'})+T(480,697,30,'MOTOR',{f:G}); s+=R(340,860,200,100,{op:eo(seg(t,.3,.8))})+T(440,917,26,'BORDE + TOPE',{op:eo(seg(t,.3,.8))}); const p=eo(seg(t,.8,2.2)); s+=L(120,910,340,910,{sw:3})+L(540,910,840,910,{sw:3,op:.0+p})+R(120+p*700,898,24,24,{fill:W}); s+=XX(480,785,eo(seg(t,1.6,2.0)),22)+L(440,860,480,730,{c:G,sw:1,d:'5 6'}); return s+sub('cada petición se resuelve en el borde',t,2.6,3.2); },
 (t,d)=>{ let s=title('EL COSTO','NO ES INSTANTÁNEO',t,60); s+=L(130,820,830,820,{c:G,sw:2}); const a1=eo(seg(t,.4,.9)),a2=eo(seg(t,1.2,1.7)),a3=eo(seg(t,2.0,2.5)); s+=R(130,780,180,80,{fill:W,op:a1})+T(220,830,26,'USO',{f:K,op:a1}); s+=R(340,780,260,80,{d:'7 6',op:a2})+T(470,830,26,'PROPAGACIÓN',{op:a2}); s+=R(630,780,200,80,{fill:W,op:a3})+T(730,830,26,'TOPE',{f:K,op:a3}); return s+sub('el tope depende de cuánto tarde en llegar',t,2.6,3.2); },
 (t,d)=>{ let s=T(CX,400,52,'EL CONTROL PESADO',{op:eo(seg(t,0,.4))}); const a=eo(seg(t,.9,1.6)); s+=R(100,520,760,230,{fill:W,op:a})+T(CX,615,40,'FUERA DEL CAMINO',{f:K,op:a})+T(CX,690,40,'DE CADA PETICIÓN',{f:K,op:a}); s+=L(130,860,130+700*eo(seg(t,1.4,2.4)),860,{sw:2}); return s+T(CX,950,34,'mide aparte, decide en el borde',{m:1,f:G,op:eo(seg(t,2.4,3.0))}); },
 (t,d)=>{ let s=T(CX,640,84,'COMENTA',{op:eo(seg(t,0,.4))});
   const a=eo(seg(t,.3,.8)); s+=R(120,720,720,190,{fill:W,op:a})+T(CX,855,118,'SISTEMA',{f:K,op:a});
   s+=T(CX,1010,40,'y te envío mi guía',{m:1,op:eo(seg(t,.9,1.3))});
   s+=T(CX,1100,34,'sígueme y comparte con tu equipo',{m:1,f:G,op:eo(seg(t,1.4,1.9))}); return s; }
];

const STAR='<path d="M12 1 L14.6 9.4 L23 12 L14.6 14.6 L12 23 L9.4 14.6 L1 12 L9.4 9.4 Z" fill="#F5F5F5"/>';
function render(tg){
  let acc=0, i=0; for(;i<SCENES.length;i++){ if(tg<acc+SCENES[i].dur) break; acc+=SCENES[i].dur; }
  if(i>=SCENES.length){ i=SCENES.length-1; acc-=SCENES[i].dur; }
  const tl=tg-acc, d=SCENES[i].dur, kk=(SCENES[i].base||d)/d, t=tl*kk;
  const sc=Math.min(eo(seg(tl,0,.28)), 1-ei(seg(tl,d-.22,d)));
  let body=DRAW[i](t,d);
  let s=`<rect width="1080" height="1920" fill="${K}"/>`;
  s+=`<g transform="translate(${CX} ${CY}) scale(${Math.max(sc,0.0001)}) translate(${-CX} ${-CY})">${body}</g>`;
  if(sc<.2) s+=`<circle cx="${CX}" cy="${CY}" r="${10*(1-sc/.2)+2}" fill="${W}"/>`;
  // marco fijo, etiqueta y marca de agua (zonas seguras)
  s+=T(70,310,26,'[ARCHITECTURE]  CONTROL DE GASTO',{a:'start',m:1,f:G,ls:2});
  s+=T(890,310,26,String(i+1).padStart(2,'0')+' / '+String(SCENES.length).padStart(2,'0'),{a:'end',m:1,f:G});
  s+=L(70,330,890,330,{c:G,sw:1});
  s+=`<g transform="translate(70 1425)"><g transform="scale(1.1)">${STAR}</g></g>`+T(112,1448,26,'JSRamirez · @jsramirezdev',{a:'start',m:1});
  document.getElementById('s').innerHTML=s;
}
</script></body></html>
